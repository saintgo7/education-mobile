name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # 코드 품질 검사
  # ============================================
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  # ============================================
  # API Gateway 빌드
  # ============================================
  build-gateway:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Gateway
        working-directory: ./api-gateway
        run: |
          docker buildx build \
            --tag api-gateway:latest \
            --output type=docker \
            .

  # ============================================
  # 마이크로서비스 빌드
  # ============================================
  build-services:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        service:
          - auth-service
          - course-service
          - payment-service
          - video-streaming-service
          - analytics-service
          - collaboration-service
          - email-marketing-service
          - ai-ml-engine
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.service }}
        working-directory: ./microservices/${{ matrix.service }}
        run: |
          docker buildx build \
            --tag ${{ matrix.service }}:latest \
            --output type=docker \
            .

  # ============================================
  # 웹 애플리케이션 빌드
  # ============================================
  build-web:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Next.js app
        working-directory: ./web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://localhost:3000' }}
        run: |
          npm install
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: web/.next

  # ============================================
  # 통합 테스트
  # ============================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: [build-gateway, build-services, build-web]
    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'  || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password123
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Wait for services
        run: |
          npm install -g wait-on
          wait-on mongodb://root:password123@localhost:27017
          wait-on redis://localhost:6379

      - name: Run integration tests
        run: npm run test:integration --if-present
        env:
          MONGODB_URI: mongodb://root:password123@localhost:27017/test_db?authSource=admin
          REDIS_URL: redis://localhost:6379

  # ============================================
  # 보안 스캔
  # ============================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # 배포 (main 브랜치만)
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    needs: [integration-tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker-compose config | grep 'image:' | awk '{print $2}' | while read image; do
            docker buildx build \
              --push \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$image \
              --file Dockerfile .
          done

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /app/education-mobile
            git pull origin main
            docker-compose pull
            docker-compose up -d
            docker-compose logs

      - name: Notify deployment
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment completed successfully! 🚀'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================
  # 성능 테스트
  # ============================================
  performance:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true

  # ============================================
  # 커버리지 리포트
  # ============================================
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate coverage
        run: npm run test:coverage --if-present

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
